# bastion edge router kernel hardening — rendered by `bastion generate` (EDGE MODE ONLY).
# Two concerns, both router-plane and both irrelevant to an endpoint (which never forwards,
# so this file is not written in endpoint mode):
#   1. IP forwarding — a router passes traffic BETWEEN networks only when these switches are on.
#      Without them the edge forward chain (LAN<->WAN, LAN<->tunnels, the IPv6 forward rules) is
#      INERT — the kernel drops forwarded packets before the rules apply.
#   2. Source-address / redirect hygiene (M2) — refuse the ICMP-redirect and source-routing
#      tricks an attacker uses to reroute or spoof through a router. Always-on, independent of
#      the IPv6-forwarding choice above.

# --- 1. IP forwarding ---
net.ipv4.ip_forward = 1
{{ network.ipv6_forward_block }}

# --- 2. Router source-address / redirect hardening (M2) ---
# SCOPE NOTE: this is redirect + source-route hardening, NOT full anti-spoof. True reverse-path
# enforcement (a BCP38 egress `saddr != LAN_CIDR drop` rule + an IPv6 `fib` rule) is deferred to
# roadmap M2b, gated on the live policy-routed VM harness — rp_filter is unsafe on this
# forced-tunnel / policy-routed box (strict blackholes asymmetric paths; loose is near-cosmetic
# and can downgrade a distro's strict default) and there is no IPv6 rp_filter sysctl to defer.

# Drop source-routed packets — they let a sender dictate the return path, a classic spoof enabler.
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# A router must never ACCEPT ICMP redirects — a spoofed redirect can reroute traffic (MITM).
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
# Moot once accept_redirects=0, but pinned explicitly for auditability.
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0

# Don't SEND ICMP redirects either — topology-leak hygiene on an edge router (v4 only; no v6 knob).
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
